[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.31
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git ; <--- Link direto resolve o erro do begin()
    lvgl/lvgl @ ^8.3.9

build_flags = 
    ; --- Configuração do CYD (ESP Amarelo) ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D TOUCH_CS=33
    ; --- CORREÇÃO DO LVGL (O Segredo está aqui) ---
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include